name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation tools
        run: python -m pip install PyYAML ruff
      - name: Check Python
        run: |
          ruff check custom_components/navimow_plus tests
          python -m unittest discover -s tests -p 'test_*.py' -q
          python -m compileall -q custom_components/navimow_plus tests
      - name: Check add-on shell script
        run: |
          bash -n navimow_local_probe/lib.sh
          bash -n navimow_local_probe/run.sh
          bash tests/test_local_probe.sh
          shellcheck navimow_local_probe/lib.sh
          shellcheck navimow_local_probe/run.sh
          shellcheck tests/test_local_probe.sh
      - name: Check JSON and YAML
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          for path in Path("custom_components/navimow_plus").rglob("*.json"):
              json.loads(path.read_text())
          for path in (
              Path("repository.yaml"),
              Path("navimow_local_probe/config.yaml"),
              Path("navimow_local_probe/build.yaml"),
          ):
              assert isinstance(yaml.safe_load(path.read_text()), dict)
          PY
