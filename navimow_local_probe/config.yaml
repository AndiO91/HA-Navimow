name: Navimow Local Probe
version: "0.1.0"
slug: navimow_local_probe
description: Read-only LAN diagnostics for a single Navimow mower
url: https://github.com/AndiO91/HA-Navimow/tree/main/navimow_local_probe
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: once
boot: manual
init: false
host_network: true
map:
  - share:rw
options:
  target_ip: ""
  include_udp: false
schema:
  target_ip: str
  include_udp: bool
